<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARTIST OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6FB;
    --surface:#FFFFFF;
    --surface-soft:#F1F0FA;
    --border:#E7E5F3;
    --text:#211E30;
    --muted:#75718C;
    --violet:#8B5CF6;
    --blue:#5B9DF9;
    --grad: linear-gradient(120deg, var(--violet), var(--blue));
    --grad-soft: linear-gradient(120deg, rgba(139,92,246,0.12), rgba(91,157,249,0.12));
    --green:#20B26C;
    --orange:#F5A524;
    --red:#EF5A5A;
    --shadow: 0 10px 30px -12px rgba(83,66,153,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- Topbar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:rgba(246,246,251,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--grad);}
  .nav{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;}
  .nav .tab{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:default;position:relative;}
  .nav .tab.active{background:var(--grad-soft);color:var(--violet);}
  .nav .tab.soon{opacity:0.45;}
  .nav .tab.soon::after{content:"bientôt";font-family:'IBM Plex Mono',monospace;font-size:8px;position:absolute;top:-7px;right:2px;background:var(--surface-soft);border:1px solid var(--border);padding:1px 4px;border-radius:5px;color:var(--muted);}

  .role-select{
    display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:6px 6px 6px 12px;
  }
  .role-select label{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .role-select select{
    border:none;background:transparent;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;color:var(--text);
    padding:6px 8px;border-radius:8px;cursor:pointer;
  }
  .role-select select:focus{outline:2px solid var(--violet);}

  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 80px;}

  .hero{
    display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;
  }
  .hero h1{font-size:24px;margin:0 0 4px;}
  .hero p{margin:0;color:var(--muted);font-size:14px;}

  .grid{display:grid;grid-template-columns:2fr 1fr;gap:18px;}
  @media (max-width:820px){.grid{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;
    box-shadow:var(--shadow);
  }
  .card + .card{margin-top:18px;}
  .card h2{font-size:14px;margin:0 0 14px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);font-weight:700;}

  /* ---- Project summary card ---- */
  .project-card{display:flex;gap:18px;align-items:center;}
  .health{
    width:64px;height:64px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:24px;position:relative;
  }
  .health.green{background:rgba(32,178,108,0.12);}
  .health.orange{background:rgba(245,165,36,0.12);}
  .health.red{background:rgba(239,90,90,0.12);}
  .project-title{font-family:'Sora',sans-serif;font-weight:700;font-size:19px;margin:0;}
  .project-meta{color:var(--muted);font-size:13px;margin-top:3px;}
  .progress-outer{height:8px;background:var(--surface-soft);border-radius:99px;margin-top:12px;overflow:hidden;}
  .progress-inner{height:100%;background:var(--grad);border-radius:99px;transition:width .4s ease;}
  .progress-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-top:6px;}

  /* ---- Task rows ---- */
  .task{
    display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:13px;
    margin-bottom:9px;background:var(--surface);
  }
  .task.blocked{border-color:rgba(239,90,90,0.35);background:rgba(239,90,90,0.04);}
  .task-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .task-dot.late{background:var(--red);}
  .task-dot.progress{background:var(--orange);}
  .task-dot.upcoming{background:var(--blue);}
  .task-dot.done{background:var(--green);}
  .task-dot.blocked{background:var(--muted);}
  .task-body{flex:1;min-width:0;}
  .task-title{font-size:13.5px;font-weight:600;}
  .task-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'IBM Plex Mono',monospace;}
  .task-block-reason{font-size:11px;color:var(--red);margin-top:3px;}
  .task select{
    border:1px solid var(--border);border-radius:9px;padding:6px 8px;font-size:12px;font-family:'Inter',sans-serif;
    background:var(--surface-soft);color:var(--text);cursor:pointer;
  }
  .empty{color:var(--muted);font-size:13px;padding:10px 2px;}

  /* ---- Alerts ---- */
  .alert{
    display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:13px;margin-bottom:9px;font-size:12.5px;
  }
  .alert.red{background:rgba(239,90,90,0.08);border:1px solid rgba(239,90,90,0.25);}
  .alert.orange{background:rgba(245,165,36,0.08);border:1px solid rgba(245,165,36,0.25);}
  .alert.green{background:rgba(32,178,108,0.08);border:1px solid rgba(32,178,108,0.25);}
  .alert b{display:block;margin-bottom:2px;}
  .alert p{margin:0;color:var(--muted);}

  /* ---- Notifications ---- */
  .notif{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border);}
  .notif:last-child{border-bottom:none;}
  .notif .time{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);white-space:nowrap;padding-top:2px;}
  .notif .txt{font-size:12.5px;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-family:'IBM Plex Mono',monospace;
    background:var(--surface-soft);border:1px solid var(--border);border-radius:99px;padding:3px 9px;color:var(--muted);
  }

  .footnote{text-align:center;color:var(--muted);font-size:11px;margin-top:30px;font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span>ARTIST OS</div>
    <div class="nav">
      <div class="tab active">Tableau de bord</div>
      <div class="tab soon">Calendrier</div>
      <div class="tab soon">Projets</div>
      <div class="tab soon">Tâches</div>
    </div>
    <div class="role-select">
      <label class="mono">RÔLE</label>
      <select id="roleSelect"></select>
    </div>
  </div>

  <div class="wrap">
    <div class="hero">
      <div>
        <h1 id="heroTitle">Bon retour</h1>
        <p id="heroSub">Voici ce qui te concerne aujourd'hui.</p>
      </div>
      <span class="badge" id="dateBadge"></span>
    </div>

    <div class="grid">
      <div>
        <div class="card project-card">
          <div class="health" id="healthDot">🟢</div>
          <div style="flex:1;">
            <div class="project-title" id="projectTitle">—</div>
            <div class="project-meta" id="projectMeta">—</div>
            <div class="progress-outer"><div class="progress-inner" id="progressBar" style="width:0%"></div></div>
            <div class="progress-label" id="progressLabel">0% prêt</div>
          </div>
        </div>

        <div class="card">
          <h2>À faire aujourd'hui / bientôt</h2>
          <div id="todayList"></div>
        </div>

        <div class="card">
          <h2>Toutes mes tâches</h2>
          <div id="allTasksList"></div>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>Alertes</h2>
          <div id="alertsList"></div>
        </div>

        <div class="card">
          <h2>Notifications récentes</h2>
          <div id="notifList"></div>
        </div>
      </div>
    </div>

    <div class="footnote">Données stockées localement dans ce navigateur — module Tableau de bord + Rôles (V1, étape 1/11)</div>
  </div>

<script>
/* ============ DATA MODEL ============ */
const ROLES = [
  {id:'artiste', label:'Artiste', icon:'🎤'},
  {id:'producteur', label:'Producteur', icon:'🎚️'},
  {id:'arrangeur', label:'Arrangeur / Beatmaker', icon:'🎧'},
  {id:'videaste', label:'Vidéaste', icon:'🎬'},
  {id:'photographe', label:'Photographe', icon:'📷'},
  {id:'infographiste', label:'Infographiste', icon:'🎨'},
  {id:'styliste', label:'Styliste', icon:'👗'},
  {id:'cm', label:'Community Manager', icon:'📱'},
  {id:'manager', label:'Manager', icon:'📋'},
];

const STORAGE_KEY = 'artistos_v1';

function seedData(){
  const today = new Date();
  const d = (offsetDays) => {
    const dt = new Date(today);
    dt.setDate(dt.getDate() + offsetDays);
    return dt.toISOString().slice(0,10);
  };
  return {
    currentRole: 'artiste',
    project: {
      title: 'DESTIN',
      type: 'Single',
      releaseDate: '2026-10-15',
    },
    tasks: [
      {id:'t1', title:'Arrangement du morceau', role:'arrangeur', status:'terminé', due:d(-20), dependsOn:[]},
      {id:'t2', title:'Mixage', role:'arrangeur', status:'en retard', due:d(-2), dependsOn:['t1']},
      {id:'t3', title:'Mastering', role:'producteur', status:'à venir', due:d(3), dependsOn:['t2']},
      {id:'t4', title:'Transmission au distributeur', role:'producteur', status:'à venir', due:d(6), dependsOn:['t3']},
      {id:'t5', title:'Pitching plateformes', role:'producteur', status:'à venir', due:d(9), dependsOn:['t4']},
      {id:'t6', title:'Shooting pochette', role:'photographe', status:'en cours', due:d(1), dependsOn:[]},
      {id:'t7', title:'Sélection & retouches photos', role:'photographe', status:'à venir', due:d(3), dependsOn:['t6']},
      {id:'t8', title:'Création pochette', role:'infographiste', status:'à venir', due:d(5), dependsOn:['t7']},
      {id:'t9', title:'Visuels réseaux sociaux', role:'infographiste', status:'à venir', due:d(8), dependsOn:['t8']},
      {id:'t10', title:'Tournage clip', role:'videaste', status:'en cours', due:d(2), dependsOn:[]},
      {id:'t11', title:'Montage clip', role:'videaste', status:'à venir', due:d(7), dependsOn:['t10']},
      {id:'t12', title:'Intégration audio final', role:'videaste', status:'à venir', due:d(9), dependsOn:['t11','t2']},
      {id:'t13', title:'Proposition de looks', role:'styliste', status:'terminé', due:d(-5), dependsOn:[]},
      {id:'t14', title:'Teaser TikTok', role:'cm', status:'à venir', due:d(10), dependsOn:['t9']},
      {id:'t15', title:'Compte à rebours Instagram', role:'cm', status:'à venir', due:d(13), dependsOn:[]},
      {id:'t16', title:'Confirmer budget clip', role:'manager', status:'en cours', due:d(1), dependsOn:[]},
    ],
    notifications: [
      {time:'09:12', text:'⚠️ Le mixage arrive à échéance dans 2 jours.'},
      {time:'08:40', text:'✅ Les looks du styliste ont été validés.'},
      {time:'Hier', text:'📁 Nouveau fichier disponible : rushes du tournage.'},
      {time:'Hier', text:'📅 Shooting pochette prévu demain.'},
    ]
  };
}

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{ return JSON.parse(raw); }catch(e){}
  }
  const seeded = seedData();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seeded));
  return seeded;
}
function saveData(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let DATA = loadData();

/* ============ HELPERS ============ */
function taskById(id){ return DATA.tasks.find(t=>t.id===id); }

function effectiveStatus(task){
  // A task is "bloqué" if it depends on a task that isn't "terminé", unless it's already done itself.
  if(task.status === 'terminé') return 'terminé';
  const blockedBy = (task.dependsOn||[]).map(taskById).filter(dep => dep && dep.status !== 'terminé');
  if(blockedBy.length){
    return {status:'bloqué', blockedBy};
  }
  return task.status;
}

function daysUntil(dateStr){
  const now = new Date(); now.setHours(0,0,0,0);
  const due = new Date(dateStr);
  return Math.round((due - now) / 86400000);
}

function fmtDue(dateStr){
  const n = daysUntil(dateStr);
  if(n < 0) return `EN RETARD DE ${Math.abs(n)} J`;
  if(n === 0) return `AUJOURD'HUI`;
  if(n === 1) return `DEMAIN`;
  return `DANS ${n} J`;
}

const roleLabel = (id) => (ROLES.find(r=>r.id===id)||{}).label || id;

/* ============ RENDER ============ */
function statusDotClass(effStatus){
  if(effStatus === 'terminé') return 'done';
  if(effStatus === 'bloqué' || (effStatus && effStatus.status === 'bloqué')) return 'blocked';
  if(effStatus === 'en retard') return 'late';
  if(effStatus === 'en cours') return 'progress';
  return 'upcoming';
}

function renderRoleSelect(){
  const sel = document.getElementById('roleSelect');
  sel.innerHTML = ROLES.map(r => `<option value="${r.id}" ${r.id===DATA.currentRole?'selected':''}>${r.icon} ${r.label}</option>`).join('');
  sel.onchange = () => {
    DATA.currentRole = sel.value;
    saveData(DATA);
    renderAll();
  };
}

function myTasks(){
  const role = DATA.currentRole;
  if(role === 'artiste' || role === 'manager') return DATA.tasks; // vue globale
  return DATA.tasks.filter(t => t.role === role);
}

function computeHealth(){
  const late = DATA.tasks.filter(t => effectiveStatus(t) === 'en retard');
  const blocked = DATA.tasks.filter(t => { const s = effectiveStatus(t); return s && s.status === 'bloqué'; });
  if(late.length > 0) return 'red';
  if(blocked.length > 1) return 'orange';
  return 'green';
}

function computeProgress(){
  const total = DATA.tasks.length;
  const done = DATA.tasks.filter(t => t.status === 'terminé').length;
  return Math.round((done/total)*100);
}

function renderHero(){
  const role = ROLES.find(r=>r.id===DATA.currentRole);
  document.getElementById('heroTitle').textContent = `Bon retour, ${role.label}`;
  const relevant = myTasks().filter(t => t.status !== 'terminé').length;
  document.getElementById('heroSub').textContent = relevant > 0
    ? `${relevant} tâche${relevant>1?'s':''} te concerne${relevant>1?'nt':''} activement.`
    : `Aucune tâche active pour toi en ce moment.`;
  document.getElementById('dateBadge').textContent = new Date().toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}

function renderProject(){
  document.getElementById('projectTitle').textContent = DATA.project.title;
  document.getElementById('projectMeta').textContent = `${DATA.project.type} · Sortie le ${new Date(DATA.project.releaseDate).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}`;
  const pct = computeProgress();
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = pct + '% des tâches terminées';
  const health = computeHealth();
  const dot = document.getElementById('healthDot');
  dot.className = 'health ' + health;
  dot.textContent = health === 'green' ? '🟢' : health === 'orange' ? '🟠' : '🔴';
}

function taskRowHtml(task, opts={}){
  const eff = effectiveStatus(task);
  const isBlocked = eff && eff.status === 'bloqué';
  const dotClass = statusDotClass(eff);
  const statusLabel = isBlocked ? 'Bloqué' : eff;
  const blockReason = isBlocked
    ? `Bloqué par : ${eff.blockedBy.map(b=>`"${b.title}" (${roleLabel(b.role)})`).join(', ')}`
    : '';
  return `
    <div class="task ${isBlocked?'blocked':''}">
      <span class="task-dot ${dotClass}"></span>
      <div class="task-body">
        <div class="task-title">${task.title}</div>
        <div class="task-sub">${roleLabel(task.role)} · ${fmtDue(task.due)}</div>
        ${blockReason ? `<div class="task-block-reason">${blockReason}</div>` : ''}
      </div>
      <select onchange="changeStatus('${task.id}', this.value)" ${isBlocked?'disabled title="Débloque d\'abord la tâche dont elle dépend"':''}>
        ${['à venir','en cours','en retard','terminé'].map(s=>`<option value="${s}" ${task.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>`;
}

function renderTodayList(){
  const list = myTasks().filter(t => {
    const eff = effectiveStatus(t);
    if(eff === 'terminé') return false;
    return daysUntil(t.due) <= 2;
  }).sort((a,b)=> daysUntil(a.due) - daysUntil(b.due));
  const el = document.getElementById('todayList');
  el.innerHTML = list.length ? list.map(t=>taskRowHtml(t)).join('') : `<div class="empty">Rien d'urgent pour l'instant 👌</div>`;
}

function renderAllTasks(){
  const list = myTasks().slice().sort((a,b)=> daysUntil(a.due) - daysUntil(b.due));
  const el = document.getElementById('allTasksList');
  el.innerHTML = list.length ? list.map(t=>taskRowHtml(t)).join('') : `<div class="empty">Aucune tâche pour ce rôle pour le moment.</div>`;
}

function renderAlerts(){
  const relevant = myTasks();
  const late = relevant.filter(t => effectiveStatus(t) === 'en retard');
  const blocked = relevant.filter(t => { const s = effectiveStatus(t); return s && s.status === 'bloqué'; });
  const el = document.getElementById('alertsList');
  let html = '';
  late.forEach(t => {
    html += `<div class="alert red"><span>🔴</span><div><b>${t.title} est en retard</b><p>Échéance dépassée de ${Math.abs(daysUntil(t.due))} jour(s). Les tâches qui en dépendent risquent d'être décalées.</p></div></div>`;
  });
  blocked.forEach(t => {
    const eff = effectiveStatus(t);
    html += `<div class="alert orange"><span>🟠</span><div><b>${t.title} est bloquée</b><p>En attente de : ${eff.blockedBy.map(b=>b.title).join(', ')}.</p></div></div>`;
  });
  if(!late.length && !blocked.length){
    html = `<div class="alert green"><span>🟢</span><div><b>Tout est sous contrôle</b><p>Aucune tâche en retard ou bloquée pour ce rôle.</p></div></div>`;
  }
  el.innerHTML = html;
}

function renderNotifications(){
  const el = document.getElementById('notifList');
  el.innerHTML = DATA.notifications.map(n => `
    <div class="notif"><div class="time mono">${n.time}</div><div class="txt">${n.text}</div></div>
  `).join('');
}

function renderAll(){
  renderRoleSelect();
  renderHero();
  renderProject();
  renderTodayList();
  renderAllTasks();
  renderAlerts();
  renderNotifications();
}

/* ============ INTERACTIONS ============ */
function changeStatus(taskId, newStatus){
  const task = taskById(taskId);
  if(!task) return;
  const oldStatus = task.status;
  task.status = newStatus;
  saveData(DATA);

  if(newStatus === 'terminé' && oldStatus !== 'terminé'){
    const dependents = DATA.tasks.filter(t => (t.dependsOn||[]).includes(taskId));
    if(dependents.length){
      DATA.notifications.unshift({
        time: 'À l\'instant',
        text: `✅ ${task.title} terminé. Prochaine étape : ${dependents.map(d=>d.title).join(', ')}.`
      });
      saveData(DATA);
    }
  }
  renderAll();
}
window.changeStatus = changeStatus;

/* ============ INIT ============ */
renderAll();
</script>
</body>
</html>
